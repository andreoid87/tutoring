<body><div id="app"><p>Caricamento del percorso…</p></div><script id="lesson-data" type="application/json">{"id":"inversa","title":"Funzione inversa","subtitle":"Impara a tornare indietro: scambia x e y, ricava la variabile e controlla il dominio dell’inversa.","tone":"purple","intro":"La funzione inversa annulla l’effetto della funzione originale: se f porta a in b, allora f⁻¹ riporta b ad a. Per avere un’inversa come funzione, f deve essere iniettiva sul dominio considerato.","pitfall":"Non confondere f⁻¹(x) con 1/f(x): il simbolo −1 in alto indica la funzione inversa, non il reciproco. Inoltre, x² su tutti i reali non è invertibile: servirebbe restringere il dominio.","map":[{"title":"1 · Scrivi","text":"Parti da y = f(x)."},{"title":"2 · Ricava","text":"Isola x in funzione di y."},{"title":"3 · Controlla","text":"Verifica l’unicità e le condizioni."},{"title":"4 · Scambia","text":"Rinomina y come x."},{"title":"5 · Dominio","text":"Usa l'immagine della f originale."}],"rules":[{"title":"Che cosa significa inversa?","tex":"f(a)=b\\ \\Longleftrightarrow\\ f^{-1}(b)=a","info":"L’inversa ricostruisce l’ingresso partendo dall’uscita."},{"title":"Il metodo algebrico","tex":"y=f(x)\\quad\\Longrightarrow\\quad x=f^{-1}(y)","info":"Risolvi l’equazione rispetto alla vecchia x. Solo alla fine puoi rinominare la variabile indipendente."},{"title":"Iniettività","tex":"f(a)=f(b)\\ \\Longrightarrow\\ a=b","info":"Per ogni valore dell’immagine deve esserci un solo ingresso. In alcuni casi è necessario restringere il dominio."},{"title":"Dominio e immagine si scambiano","tex":"D_{f^{-1}}=\\operatorname{Im}(f)","info":"Il dominio della funzione inversa coincide con i valori effettivamente prodotti da f."},{"title":"Controllo con composizione","tex":"f(f^{-1}(x))=x","info":"Se le funzioni sono inverse, tornare indietro e poi andare avanti restituisce il valore iniziale, sul dominio corretto."},{"title":"Radici e intervalli","tex":"\\sqrt{u}\\ge0","info":"Quando compare una radice quadrata, tieni conto dell’intervallo dei possibili risultati prima di elevare al quadrato."}],"guided":[{"title":"Inversa di una retta","tex":"f(x)=\\frac13x-4","intro":"Una retta con coefficiente angolare diverso da zero è invertibile su tutti i reali.","steps":[{"title":"Scrivi la funzione con y","tex":"y=\\frac13x-4","text":"Non devi sostituire valori numerici: si lavora con le lettere."},{"title":"Isola x","tex":"y+4=\\frac{x}{3}\\ \\Longrightarrow\\ x=3y+12","text":"Prima somma 4, poi moltiplica per 3."},{"title":"Scambia i nomi delle variabili","tex":"f^{-1}(x)=3x+12","text":"L'inversa usa la lettera x per il suo ingresso."}],"result":"f^{-1}(x)=3x+12,\\qquad D_{f^{-1}}=\\mathbb{R}","note":"Verifica: f(3x+12) = (3x+12)/3 − 4 = x."},{"title":"Inversa di una funzione razionale","tex":"f(x)=\\frac{3x+1}{x-4}","intro":"Quando x compare sia sopra sia sotto la linea di frazione, moltiplica per il denominatore e raccogli x.","steps":[{"title":"Imposta l’equazione","tex":"y=\\frac{3x+1}{x-4}","text":"La funzione originale richiede x ≠ 4."},{"title":"Elimina il denominatore","tex":"y(x-4)=3x+1","text":"Moltiplica entrambi i membri per x − 4."},{"title":"Raccogli le x","tex":"yx-4y=3x+1\\Rightarrow x(y-3)=4y+1","text":"Porta i termini con x da una parte."},{"title":"Ricava la vecchia x","tex":"x=\\frac{4y+1}{y-3}","text":"Non puoi dividere per y − 3 se y = 3: quel valore non compare nell’immagine."}],"result":"f^{-1}(x)=\\frac{4x+1}{x-3},\\qquad x\\ne3","note":"Il dominio dell'inversa esclude 3, mentre quello originale esclude 4."},{"title":"Una radice al denominatore","tex":"f(x)=\\frac1{\\sqrt{2x}}","intro":"Qui la funzione è definita solo per x>0 e fornisce soltanto risultati positivi.","steps":[{"title":"Dominio e immagine","tex":"x>0\\qquad\\text{e}\\qquad y>0","text":"Il denominatore non può essere zero. Il rapporto è positivo."},{"title":"Imposta","tex":"y=\\frac1{\\sqrt{2x}}","text":"Isola prima la radice."},{"title":"Eleva al quadrato","tex":"\\sqrt{2x}=\\frac1y\\Rightarrow2x=\\frac1{y^2}","text":"L’elevamento al quadrato è coerente perché y è positivo."},{"title":"Ricava x","tex":"x=\\frac1{2y^2}","text":"Sostituisci infine y con la nuova x."}],"result":"f^{-1}(x)=\\frac1{2x^2},\\qquad x>0","note":"Attenzione: la formula 1/(2x²) avrebbe senso anche per x\u003c0, ma l’inversa deve avere dominio x>0."},{"title":"Inversa della radice","tex":"f(x)=\\sqrt{2x-4}","intro":"La radice quadrata restituisce solo valori non negativi.","steps":[{"title":"Dominio e immagine dell'originale","tex":"x\\ge2,\\qquad y\\ge0","text":"Per avere il radicando ≥0 serve x≥2."},{"title":"Parti dall'equazione","tex":"y=\\sqrt{2x-4}","text":"Il vecchio y è non negativo."},{"title":"Eleva al quadrato","tex":"y^2=2x-4\\Rightarrow x=\\frac{y^2+4}{2}","text":"Questa trasformazione è valida tenendo il vincolo y≥0."},{"title":"Scambia la variabile","tex":"f^{-1}(x)=\\frac{x^2+4}{2}","text":"Il dominio dell’inversa è la precedente immagine."}],"result":"f^{-1}(x)=\\frac{x^2+4}{2},\\qquad x\\ge0","note":"La restrizione x≥0 è indispensabile per avere davvero l’inversa della radice."}],"book":[{"tex":"f(x)=\\frac13x-4","result":"f^{-1}(x)=3x+12,\\quad x\\in\\mathbb{R}","reason":"y + 4 = x/3, quindi x = 3(y + 4)."},{"tex":"f(x)=\\frac1{1+2x}","result":"f^{-1}(x)=\\frac{1-x}{2x},\\quad x\\ne0","reason":"Da y(1+2x)=1 ricavi x=(1−y)/(2y). La funzione originale non assume il valore zero."},{"tex":"f(x)=\\frac6x-1","result":"f^{-1}(x)=\\frac6{x+1},\\quad x\\ne-1","reason":"Da y+1=6/x segue x=6/(y+1). L’originale non assume −1."},{"tex":"f(x)=3+\\frac4{2-x}","result":"f^{-1}(x)=\\frac{10-2x}{3-x},\\quad x\\ne3","reason":"y−3=4/(2−x), da cui (y−3)(2−x)=4. Il valore 3 non è nell’immagine."},{"tex":"f(x)=\\frac{3x+1}{x-4}","result":"f^{-1}(x)=\\frac{4x+1}{x-3},\\quad x\\ne3","reason":"Moltiplica per x−4, raccogli i termini con x e dividi per y−3."},{"tex":"f(x)=\\frac1{\\sqrt{2x}}","result":"f^{-1}(x)=\\frac1{2x^2},\\quad x>0","reason":"Eleva al quadrato e ricordati che l’immagine della funzione originale è solo positiva."},{"tex":"f(x)=\\sqrt{2x-4}","result":"f^{-1}(x)=\\frac{x^2+4}{2},\\quad x\\ge0","reason":"Per isolare x eleva al quadrato; l’immagine della radice è [0,+∞)."}],"quiz":[{"prompt":"Qual è l’inversa della funzione?","tex":"f(x)=x-3","options":["x-3","x+3","\\frac1{x-3}","3-x"],"correct":1,"explain":"Se y=x−3, ricavando x ottieni x=y+3."},{"prompt":"Qual è l’inversa?","tex":"f(x)=\\frac1{x-2}","options":["\\frac1x-2","\\frac1{x+2}","2+\\frac1x","x+2"],"correct":2,"explain":"Da y=1/(x−2) segue x−2=1/y, quindi x=2+1/y."},{"prompt":"Qual è l’inversa con il dominio corretto?","tex":"f(x)=\\sqrt{x+2}","options":["x^2-2,\\ x\\ge0","x^2+2,\\ x\\in\\mathbb{R}","x^2-2,\\ x\\in\\mathbb{R}","\\sqrt{x-2},\\ x\\ge2"],"correct":0,"explain":"La radice è non negativa, quindi il dominio dell’inversa è x≥0."},{"prompt":"f(x)=x² è invertibile su tutti i reali?","tex":"f(x)=x^2,\\quad D=\\mathbb{R}","options":["\\text{sì, sempre}","\\text{no: f(2)=f(-2)}","\\text{no: manca il dominio}","\\text{sì, inversa }1/x^2"],"correct":1,"explain":"Non è iniettiva su R. Su x≥0 diventerebbe invertibile con inversa √x."},{"prompt":"Qual è l’inversa dell’esponenziale?","tex":"f(x)=e^x","options":["e^{-x}","1/x","\\ln x,\\quad x>0","\\ln x,\\quad x\\in\\mathbb R"],"correct":2,"explain":"ln x annulla l’esponenziale, ma può ricevere solo argomenti positivi."},{"prompt":"Qual è il dominio della funzione inversa?","tex":"f(x)=\\frac1{x+1}","options":["x\\ne-1","x>0","x\\ne0","\\mathbb{R}"],"correct":2,"explain":"L’originale non può produrre zero. L’inversa riceve in ingresso tutti i numeri tranne zero."}]}</script></body></html>
