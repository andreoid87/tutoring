<body><div id="app"><p>Caricamento del percorso…</p></div><script id="lesson-data" type="application/json">{"id":"inversa","title":"Funzione inversa","subtitle":"Dalle scatole ingresso→uscita alla parabola: capire quando si può tornare indietro.","tone":"purple","intro":"La funzione parte da un ingresso e produce un’uscita. L’inversa prova a fare il percorso contrario.","pitfall":"f⁻¹ non è 1/f. Se due ingressi danno la stessa uscita, limita il dominio prima di invertire.","map":[],"rules":[{"title":"Ogni ingresso ha una sola uscita","tex":"x\\longmapsto f(x)","info":"Una funzione assegna una sola y a ciascuna x. Ingressi diversi possono però arrivare alla stessa uscita.","visual":"inverse-mapping"},{"title":"L’inversa scambia ingresso e uscita","tex":"f(a)=b\\quad\\Longleftrightarrow\\quad f^{-1}(b)=a","info":"Per invertire serve anche che ogni uscita corrisponda a un solo ingresso. Con x² devi scegliere un ramo: x ≥ 0 oppure x ≤ 0.","visual":"inverse-branches"}],"guided":[{"title":"Inversa di una retta","tex":"f(x)=\\frac13x-4","intro":"Una retta con coefficiente angolare diverso da zero è invertibile su tutti i reali.","steps":[{"title":"Scrivi la funzione con y","tex":"y=\\frac13x-4","text":"Non devi sostituire valori numerici: si lavora con le lettere."},{"title":"Isola x","tex":"y+4=\\frac{x}{3}\\ \\Longrightarrow\\ x=3y+12","text":"Prima somma 4, poi moltiplica per 3."},{"title":"Scambia i nomi delle variabili","tex":"f^{-1}(x)=3x+12","text":"L'inversa usa la lettera x per il suo ingresso."}],"result":"f^{-1}(x)=3x+12,\\qquad D_{f^{-1}}=\\mathbb{R}","note":"Verifica: f(3x+12) = (3x+12)/3 − 4 = x."},{"title":"Inversa della radice","tex":"f(x)=\\sqrt{2x-4}","intro":"La radice quadrata restituisce solo valori non negativi.","steps":[{"title":"Dominio e immagine dell'originale","tex":"x\\ge2,\\qquad y\\ge0","text":"Per avere il radicando ≥0 serve x≥2."},{"title":"Parti dall'equazione","tex":"y=\\sqrt{2x-4}","text":"Il vecchio y è non negativo."},{"title":"Eleva al quadrato","tex":"y^2=2x-4\\Rightarrow x=\\frac{y^2+4}{2}","text":"Questa trasformazione è valida tenendo il vincolo y≥0."},{"title":"Scambia la variabile","tex":"f^{-1}(x)=\\frac{x^2+4}{2}","text":"Il dominio dell’inversa è la precedente immagine."}],"result":"f^{-1}(x)=\\frac{x^2+4}{2},\\qquad x\\ge0","note":"La restrizione x≥0 è indispensabile per avere davvero l’inversa della radice."}],"book":[{"tex":"f(x)=\\frac13x-4","result":"f^{-1}(x)=3x+12,\\quad x\\in\\mathbb{R}","reason":"y + 4 = x/3, quindi x = 3(y + 4)."},{"tex":"f(x)=\\frac1{1+2x}","result":"f^{-1}(x)=\\frac{1-x}{2x},\\quad x\\ne0","reason":"Da y(1+2x)=1 ricavi x=(1−y)/(2y). La funzione originale non assume il valore zero."},{"tex":"f(x)=\\frac6x-1","result":"f^{-1}(x)=\\frac6{x+1},\\quad x\\ne-1","reason":"Da y+1=6/x segue x=6/(y+1). L’originale non assume −1."},{"tex":"f(x)=3+\\frac4{2-x}","result":"f^{-1}(x)=\\frac{10-2x}{3-x},\\quad x\\ne3","reason":"y−3=4/(2−x), da cui (y−3)(2−x)=4. Il valore 3 non è nell’immagine."},{"tex":"f(x)=\\frac{3x+1}{x-4}","result":"f^{-1}(x)=\\frac{4x+1}{x-3},\\quad x\\ne3","reason":"Moltiplica per x−4, raccogli i termini con x e dividi per y−3."},{"tex":"f(x)=\\frac1{\\sqrt{2x}}","result":"f^{-1}(x)=\\frac1{2x^2},\\quad x>0","reason":"Eleva al quadrato e ricordati che l’immagine della funzione originale è solo positiva."},{"tex":"f(x)=\\sqrt{2x-4}","result":"f^{-1}(x)=\\frac{x^2+4}{2},\\quad x\\ge0","reason":"Per isolare x eleva al quadrato; l’immagine della radice è [0,+∞)."}],"quiz":[{"prompt":"Qual è l’inversa della funzione?","tex":"f(x)=x-3","options":["x-3","x+3","\\frac1{x-3}","3-x"],"correct":1,"explain":"Se y=x−3, ricavando x ottieni x=y+3."},{"prompt":"Qual è l’inversa?","tex":"f(x)=\\frac1{x-2}","options":["\\frac1x-2","\\frac1{x+2}","2+\\frac1x","x+2"],"correct":2,"explain":"Da y=1/(x−2) segue x−2=1/y, quindi x=2+1/y."},{"prompt":"Qual è l’inversa con il dominio corretto?","tex":"f(x)=\\sqrt{x+2}","options":["x^2-2,\\ x\\ge0","x^2+2,\\ x\\in\\mathbb{R}","x^2-2,\\ x\\in\\mathbb{R}","\\sqrt{x-2},\\ x\\ge2"],"correct":0,"explain":"La radice è non negativa, quindi il dominio dell’inversa è x≥0."},{"prompt":"f(x)=x² è invertibile su tutti i reali?","tex":"f(x)=x^2,\\quad D=\\mathbb{R}","options":["\\text{sì, sempre}","\\text{no: f(2)=f(-2)}","\\text{no: manca il dominio}","\\text{sì, inversa }1/x^2"],"correct":1,"explain":"Non è iniettiva su R. Su x≥0 diventerebbe invertibile con inversa √x."},{"prompt":"Qual è l’inversa dell’esponenziale?","tex":"f(x)=e^x","options":["e^{-x}","1/x","\\ln x,\\quad x>0","\\ln x,\\quad x\\in\\mathbb R"],"correct":2,"explain":"ln x annulla l’esponenziale, ma può ricevere solo argomenti positivi."},{"prompt":"Qual è il dominio della funzione inversa?","tex":"f(x)=\\frac1{x+1}","options":["x\\ne-1","x>0","x\\ne0","\\mathbb{R}"],"correct":2,"explain":"L’originale non può produrre zero. L’inversa riceve in ingresso tutti i numeri tranne zero."}]}</script></body></html>
