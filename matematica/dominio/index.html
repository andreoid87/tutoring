<script id="lesson-data" type="application/json">{"id":"dominio","title":"Dominio delle funzioni","subtitle":"Tre condizioni da riconoscere, poi un solo dominio: denominatore, radice e logaritmo.","tone":"","intro":"Prima individua le operazioni presenti: denominatore, radice quadrata e logaritmo. Scrivi soltanto le condizioni necessarie, poi intersecale.","pitfall":"Intersecare significa rispettare tutti i vincoli contemporaneamente. La radice al denominatore richiede > 0 perché il denominatore non può essere zero.","map":[{"title":"1 · Individua","text":"Denominatori, radici e logaritmi."},{"title":"2 · Imposta","text":"Una condizione per ogni vincolo."},{"title":"3 · Risolvi","text":"Trova i valori ammessi."},{"title":"4 · Interseca","text":"Tutte le condizioni insieme."},{"title":"5 · Scrivi D","text":"D = {x ∈ ℝ | condizioni}."}],"rules":[{"title":"Denominatore","tex":"f(x)=\\frac{A(x)}{B(x)}\\quad\\Rightarrow\\quad B(x)\\ne0","info":"Non può essere zero. Il numeratore, invece, può esserlo."},{"title":"Radice quadrata","tex":"\\sqrt{A(x)}\\Rightarrow A(x)\\ge0","info":"Sotto una radice quadrata serve un valore ≥ 0."},{"title":"Logaritmo","tex":"\\ln(A(x))\\Rightarrow A(x)>0","info":"Dentro un logaritmo serve un valore > 0."}],"guided":[{"title":"Un logaritmo con un trinomio","tex":"f(x)=\\ln(x^2-4x-12)","intro":"Il logaritmo esiste soltanto se il suo argomento è positivo.","steps":[{"title":"Trova il vincolo","tex":"x^2-4x-12>0","text":"Il segno è > e non ≥."},{"title":"Scomponi","tex":"(x-6)(x+2)>0","text":"Cerchiamo due numeri il cui prodotto sia −12 e la cui somma sia −4."},{"title":"Studia il segno del prodotto","tex":"x\u003c-2\\ \\lor\\ x>6","text":"Con parabola rivolta verso l’alto, il prodotto è positivo fuori dalle radici."}],"result":"D=(-\\infty,-2)\\cup(6,+\\infty)","note":"I punti −2 e 6 sono esclusi: annullano l'argomento del logaritmo."},{"title":"Una radice di un logaritmo","tex":"f(x)=\\sqrt{-\\ln x}","intro":"Qui convivono un logaritmo e una radice quadrata: serve rispettare entrambi i vincoli.","steps":[{"title":"Per il logaritmo","tex":"x>0","text":"ln x richiede x positivo."},{"title":"Per la radice","tex":"-\\ln x\\ge 0\\ \\Longleftrightarrow\\ \\ln x\\le0","text":"Il meno davanti al logaritmo cambia il verso della disuguaglianza."},{"title":"Risolvi e interseca","tex":"\\ln x\\le0\\Longleftrightarrow x\\le1","text":"Combinando con x > 0 otteniamo l’intervallo richiesto."}],"result":"D=(0,1]","note":"1 è incluso perché √0 esiste; 0 è escluso perché ln 0 non esiste."},{"title":"Logaritmo con radice nell’argomento","tex":"f(x)=\\ln(2x-\\sqrt{x})","intro":"Non basta imporre x ≥ 0: tutto l’argomento del logaritmo deve risultare positivo.","steps":[{"title":"Per la radice","tex":"x\\ge0","text":"La radice quadrata di x deve essere definita."},{"title":"Per il logaritmo","tex":"2x-\\sqrt{x}>0","text":"L’argomento del logaritmo deve essere > 0."},{"title":"Sostituisci t = √x","tex":"t=\\sqrt{x}\\ge0,\\quad 2t^2-t>0","text":"Diventa un prodotto più semplice."},{"title":"Risolvi la disequazione","tex":"t(2t-1)>0\\Longrightarrow t>\\frac12","text":"L'altra possibilità t \u003c 0 è incompatibile con la radice."},{"title":"Torna a x","tex":"\\sqrt{x}>\\frac12\\Longrightarrow x>\\frac14","text":"Entrambi i membri sono non negativi, quindi possiamo elevare al quadrato."}],"result":"D=\\left(\\frac14,+\\infty\\right)","note":"Nel punto 1/4 l’argomento del logaritmo vale zero: il punto non è incluso."}],"book":[{"tex":"\\ln(x-4)","result":"D=(4,+\\infty)","reason":"Argomento del logaritmo positivo: x − 4 > 0."},{"tex":"\\ln(1+2x+x^2)","result":"D=\\mathbb{R}\\setminus\\{-1\\}","reason":"L’argomento è (x + 1)², positivo tranne quando x = −1."},{"tex":"e^{1/x}","result":"D=\\mathbb{R}\\setminus\\{0\\}","reason":"L’esponenziale esiste, ma l’esponente 1/x richiede x diverso da 0."},{"tex":"\\sqrt{-\\ln x}","result":"D=(0,1]","reason":"Devi avere sia x > 0 sia −ln x ≥ 0."},{"tex":"\\ln(x^2-4x-12)","result":"D=(-\\infty,-2)\\cup(6,+\\infty)","reason":"(x − 6)(x + 2) > 0, quindi fuori dalle due radici."},{"tex":"\\frac1{\\ln x}","result":"D=(0,1)\\cup(1,+\\infty)","reason":"ln x esiste per x > 0; essendo al denominatore deve anche essere diverso da 0, cioè x ≠ 1."},{"tex":"2\\sqrt{\\frac{x}{x-3}}","result":"D=(-\\infty,0]\\cup(3,+\\infty)","reason":"x/(x − 3) ≥ 0 e x ≠ 3. Lo zero x = 0 è ammesso."},{"tex":"\\sqrt{\\ln(x+3)}","result":"D=[-2,+\\infty)","reason":"La condizione ln(x + 3) ≥ 0 equivale a x + 3 ≥ 1."},{"tex":"\\ln(2x-\\sqrt{x})","result":"D=(\\frac14,+\\infty)","reason":"Poni t = √x ≥ 0; t(2t − 1) > 0 richiede t > 1/2."},{"tex":"\\ln\\left(\\frac{3-x}{1-x^2}\\right)","result":"D=(-1,1)\\cup(3,+\\infty)","reason":"La frazione dentro ln deve essere > 0. I punti −1 e 1 annullano il denominatore; 3 annulla il numeratore."}],"quiz":[{"prompt":"Qual è il dominio?","tex":"f(x)=\\ln(x-5)","options":["x\\ge5","x>5","x\\ne5","\\mathbb{R}"],"correct":1,"explain":"Il logaritmo non accetta zero: x−5 deve essere strettamente positivo."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\sqrt{2-x}","options":["x\u003c2","x\\ge2","x\\le2","\\mathbb{R}"],"correct":2,"explain":"Il radicando deve essere ≥0, quindi 2−x ≥ 0 e x ≤2."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\frac{1}{\\sqrt{x+1}}","options":["x\\ge -1","x>-1","x\\ne -1","x\\le-1"],"correct":1,"explain":"La radice è al denominatore: x+1 deve essere >0, non ≥0."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\ln(x^2)","options":["x>0","x\\ge0","x\\ne0","\\mathbb{R}"],"correct":2,"explain":"x² è positivo per tutti i reali tranne zero, anche se x è negativo."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\sqrt{\\ln(x+2)}","options":["x>-2","x\\ge-1","x>-1","x\\ge-2"],"correct":1,"explain":"Servono ln(x+2) ≥0 e x+2>0: equivalgono a x≥−1."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\ln\\left(\\frac{1}{x-2}\\right)","options":["x\\ne2","x\u003c2","x>2","\\mathbb{R}"],"correct":2,"explain":"1/(x−2) è positiva solamente quando x−2>0."}]}</script></body></html>
