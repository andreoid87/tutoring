<script id="lesson-data" type="application/json">{"id":"dominio","title":"Dominio delle funzioni","subtitle":"Scopri per quali valori di x una funzione esiste. Radici, frazioni, logaritmi e condizioni da combinare.","tone":"","page":"801","intro":"Il dominio è l’insieme dei valori che puoi inserire al posto di x senza incontrare operazioni impossibili nei numeri reali.","pitfall":"Attenzione: sotto una radice quadrata normale puoi avere anche zero (≥ 0). Sotto una radice quadrata al denominatore, invece, deve esserci un valore strettamente positivo (> 0).","map":[{"title":"1 · Osserva","text":"Quali operazioni ci sono?"},{"title":"2 · Imposta","text":"Scrivi una condizione per ognuna."},{"title":"3 · Risolvi","text":"Trova gli intervalli ammessi."},{"title":"4 · Incrocia","text":"Interseca tutte le condizioni."},{"title":"5 · Scrivi D","text":"Presenta il dominio finale."}],"rules":[{"title":"Frazione","tex":"f(x)=\\frac{A(x)}{B(x)}\\quad\\Rightarrow\\quad B(x)\\ne0","info":"Il denominatore non può mai annullarsi. Il numeratore può essere zero."},{"title":"Radice quadrata","tex":"\\sqrt{A(x)}\\Rightarrow A(x)\\ge0","info":"Il radicando deve essere maggiore o uguale a zero."},{"title":"Logaritmo","tex":"\\ln(A(x))\\Rightarrow A(x)>0","info":"L’argomento del logaritmo deve essere strettamente positivo, mai zero."},{"title":"Radice al denominatore","tex":"\\frac{1}{\\sqrt{A(x)}}\\Rightarrow A(x)>0","info":"La radice deve esistere e il denominatore deve essere diverso da zero."},{"title":"Esponenziale","tex":"e^x\\text{ e }2^x\\ \\text{esistono per ogni }x\\in\\mathbb{R}","info":"L’esponenziale con base positiva costante non crea restrizioni da solo. Restrizioni possono arrivare dall’esponente, per esempio 1/x."},{"title":"Più vincoli","tex":"D=D_1\\cap D_2\\cap\\cdots","info":"Quando ci sono più operazioni, devi soddisfare tutte le loro condizioni contemporaneamente."}],"guided":[{"reference":"Libro n. 132","title":"Un logaritmo con un trinomio","tex":"f(x)=\\ln(x^2-4x-12)","intro":"Il logaritmo esiste soltanto se il suo argomento è positivo.","steps":[{"title":"Trova il vincolo","tex":"x^2-4x-12>0","text":"Il segno è > e non ≥."},{"title":"Scomponi","tex":"(x-6)(x+2)>0","text":"Cerchiamo due numeri il cui prodotto sia −12 e la cui somma sia −4."},{"title":"Studia il segno del prodotto","tex":"x\u003c-2\\ \\lor\\ x>6","text":"Con parabola rivolta verso l’alto, il prodotto è positivo fuori dalle radici."}],"result":"D=(-\\infty,-2)\\cup(6,+\\infty)","note":"I punti −2 e 6 sono esclusi: annullano l'argomento del logaritmo."},{"reference":"Libro n. 130","title":"Una radice di un logaritmo","tex":"f(x)=\\sqrt{-\\ln x}","intro":"Qui convivono un logaritmo e una radice quadrata: serve rispettare entrambi i vincoli.","steps":[{"title":"Per il logaritmo","tex":"x>0","text":"ln x richiede x positivo."},{"title":"Per la radice","tex":"-\\ln x\\ge 0\\ \\Longleftrightarrow\\ \\ln x\\le0","text":"Il meno davanti al logaritmo cambia il verso della disuguaglianza."},{"title":"Risolvi e interseca","tex":"\\ln x\\le0\\Longleftrightarrow x\\le1","text":"Combinando con x > 0 otteniamo l’intervallo richiesto."}],"result":"D=(0,1]","note":"1 è incluso perché √0 esiste; 0 è escluso perché ln 0 non esiste."},{"reference":"Libro n. 153","title":"Logaritmo con radice nell’argomento","tex":"f(x)=\\ln(2x-\\sqrt{x})","intro":"Non basta imporre x ≥ 0: tutto l’argomento del logaritmo deve risultare positivo.","steps":[{"title":"Per la radice","tex":"x\\ge0","text":"La radice quadrata di x deve essere definita."},{"title":"Per il logaritmo","tex":"2x-\\sqrt{x}>0","text":"L’argomento del logaritmo deve essere > 0."},{"title":"Sostituisci t = √x","tex":"t=\\sqrt{x}\\ge0,\\quad 2t^2-t>0","text":"Diventa un prodotto più semplice."},{"title":"Risolvi la disequazione","tex":"t(2t-1)>0\\Longrightarrow t>\\frac12","text":"L'altra possibilità t \u003c 0 è incompatibile con la radice."},{"title":"Torna a x","tex":"\\sqrt{x}>\\frac12\\Longrightarrow x>\\frac14","text":"Entrambi i membri sono non negativi, quindi possiamo elevare al quadrato."}],"result":"D=\\left(\\frac14,+\\infty\\right)","note":"Nel punto 1/4 l’argomento del logaritmo vale zero: il punto non è incluso."}],"book":[{"n":123,"tex":"\\ln(x-4)","result":"D=(4,+\\infty)","reason":"Argomento del logaritmo positivo: x − 4 > 0."},{"n":127,"tex":"\\ln(1+2x+x^2)","result":"D=\\mathbb{R}\\setminus\\{-1\\}","reason":"L’argomento è (x + 1)², positivo tranne quando x = −1."},{"n":128,"tex":"e^{1/x}","result":"D=\\mathbb{R}\\setminus\\{0\\}","reason":"L’esponenziale esiste, ma l’esponente 1/x richiede x diverso da 0."},{"n":130,"tex":"\\sqrt{-\\ln x}","result":"D=(0,1]","reason":"Devi avere sia x > 0 sia −ln x ≥ 0."},{"n":132,"tex":"\\ln(x^2-4x-12)","result":"D=(-\\infty,-2)\\cup(6,+\\infty)","reason":"(x − 6)(x + 2) > 0, quindi fuori dalle due radici."},{"n":141,"tex":"\\frac1{\\ln x}","result":"D=(0,1)\\cup(1,+\\infty)","reason":"ln x esiste per x > 0; essendo al denominatore deve anche essere diverso da 0, cioè x ≠ 1."},{"n":145,"tex":"2\\sqrt{\\frac{x}{x-3}}","result":"D=(-\\infty,0]\\cup(3,+\\infty)","reason":"x/(x − 3) ≥ 0 e x ≠ 3. Lo zero x = 0 è ammesso."},{"n":147,"tex":"\\sqrt{\\ln(x+3)}","result":"D=[-2,+\\infty)","reason":"La condizione ln(x + 3) ≥ 0 equivale a x + 3 ≥ 1."},{"n":153,"tex":"\\ln(2x-\\sqrt{x})","result":"D=(\\frac14,+\\infty)","reason":"Poni t = √x ≥ 0; t(2t − 1) > 0 richiede t > 1/2."},{"n":160,"tex":"\\ln\\left(\\frac{3-x}{1-x^2}\\right)","result":"D=(-1,1)\\cup(3,+\\infty)","reason":"La frazione dentro ln deve essere > 0. I punti −1 e 1 annullano il denominatore; 3 annulla il numeratore."}],"quiz":[{"prompt":"Qual è il dominio?","tex":"f(x)=\\ln(x-5)","options":["x\\ge5","x>5","x\\ne5","\\mathbb{R}"],"correct":1,"explain":"Il logaritmo non accetta zero: x−5 deve essere strettamente positivo."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\sqrt{2-x}","options":["x\u003c2","x\\ge2","x\\le2","\\mathbb{R}"],"correct":2,"explain":"Il radicando deve essere ≥0, quindi 2−x ≥ 0 e x ≤2."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\frac{1}{\\sqrt{x+1}}","options":["x\\ge -1","x>-1","x\\ne -1","x\\le-1"],"correct":1,"explain":"La radice è al denominatore: x+1 deve essere >0, non ≥0."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\ln(x^2)","options":["x>0","x\\ge0","x\\ne0","\\mathbb{R}"],"correct":2,"explain":"x² è positivo per tutti i reali tranne zero, anche se x è negativo."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\sqrt{\\ln(x+2)}","options":["x>-2","x\\ge-1","x>-1","x\\ge-2"],"correct":1,"explain":"Servono ln(x+2) ≥0 e x+2>0: equivalgono a x≥−1."},{"prompt":"Qual è il dominio?","tex":"f(x)=\\ln\\left(\\frac{1}{x-2}\\right)","options":["x\\ne2","x\u003c2","x>2","\\mathbb{R}"],"correct":2,"explain":"1/(x−2) è positiva solamente quando x−2>0."}]}</script></body></html>
