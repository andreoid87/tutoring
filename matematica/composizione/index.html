<body><div id="app"><p>Caricamento del percorso…</p></div><script id="lesson-data" type="application/json">{"id":"composizione","title":"Composizione di funzioni","subtitle":"Due funzioni, un ordine preciso: prima applichi quella interna, poi quella esterna. Impara anche i domini.","tone":"orange","page":"820","intro":"La scrittura f∘g non indica una moltiplicazione: significa inserire il risultato di g dentro f. Cambiare l’ordine può cambiare completamente il risultato.","pitfall":"Non puoi scambiare liberamente f e g: in generale f∘g ≠ g∘f. Controlla inoltre il dominio dell’interno e che il suo risultato sia ammesso dall’esterno.","map":[{"title":"1 · Leggi","text":"In f∘g, g si applica per prima."},{"title":"2 · Calcola","text":"Scrivi g(x), la funzione interna."},{"title":"3 · Sostituisci","text":"Metti g(x) al posto di x in f."},{"title":"4 · Semplifica","text":"Riduci l’espressione senza errori."},{"title":"5 · Dominio","text":"Controlla entrambe le funzioni."}],"rules":[{"title":"Prima g, poi f","tex":"(f\\circ g)(x)=f(g(x))","info":"Leggi dall’interno verso l’esterno: prima g(x), poi f applicata al risultato."},{"title":"Prima f, poi g","tex":"(g\\circ f)(x)=g(f(x))","info":"L’ordine cambia il modo in cui una formula viene inserita nell’altra."},{"title":"L'ordine conta","tex":"f\\circ g\\ne g\\circ f\\quad\\text{in generale}","info":"La composizione normalmente non è commutativa, anche quando entrambe le composizioni esistono."},{"title":"Dominio della composizione","tex":"D_{f\\circ g}=\\{x\\in D_g\\mid g(x)\\in D_f\\}","info":"Deve esistere g(x), e quel risultato deve essere un ingresso valido per f."},{"title":"Logaritmi ed esponenziali","tex":"\\ln(e^t)=t,\\qquad e^{\\ln t}=t\\ (t>0)","info":"Sono operazioni inverse; nella seconda identità t deve essere positivo."},{"title":"Potenza e radice","tex":"(\\sqrt{x})^2=x\\ (x\\ge0),\\quad \\sqrt{x^2}=|x|","info":"In generale non puoi eliminare la radice di un quadrato senza considerare il valore assoluto."}],"guided":[{"reference":"Libro n. 421","title":"Una funzione lineare e un polinomio","tex":"f(x)=x+4,\\qquad g(x)=x^2-x","intro":"Nessuna restrizione di dominio: entrambe sono definite su tutti i reali.","steps":[{"title":"Calcola f∘g: dentro c’è g","tex":"f(g(x))=g(x)+4","text":"Nella formula di f, al posto della x metti tutta g(x)."},{"title":"Sostituisci g(x)","tex":"f(g(x))=(x^2-x)+4=x^2-x+4","text":"Hai ottenuto la prima composizione."},{"title":"Calcola g∘f: dentro c’è f","tex":"g(f(x))=(x+4)^2-(x+4)","text":"Nella formula di g sostituisci ogni x con x+4."},{"title":"Sviluppa il quadrato","tex":"x^2+8x+16-x-4=x^2+7x+12","text":"Le due composizioni danno risultati differenti."}],"result":"(f\\circ g)(x)=x^2-x+4,\\quad(g\\circ f)(x)=x^2+7x+12","note":"L’ordine della composizione conta anche con formule molto semplici."},{"reference":"Libro n. 422","title":"Composizione e logaritmi","tex":"f(x)=3x,\\qquad g(x)=\\ln x","intro":"I domini vanno valutati dopo aver composto: il logaritmo accetta solo argomenti positivi.","steps":[{"title":"Calcola f∘g","tex":"f(g(x))=3\\ln x","text":"La funzione interna g richiede x>0."},{"title":"Calcola g∘f","tex":"g(f(x))=\\ln(3x)","text":"Ora l’argomento del logaritmo è 3x."},{"title":"Controlla il dominio","tex":"3x>0\\Longleftrightarrow x>0","text":"In questo esercizio entrambe le composizioni hanno lo stesso dominio, pur essendo diverse."}],"result":"f\\circ g=3\\ln x,\\quad g\\circ f=\\ln(3x),\\quad D=(0,+\\infty)","note":"Non confondere 3 ln x con ln(3x): sono funzioni diverse."},{"reference":"Libro n. 426","title":"Logaritmo ed esponenziale","tex":"f(x)=\\ln(2x),\\qquad g(x)=e^{-x}","intro":"Le proprietà dei logaritmi semplificano la prima composizione; la seconda impone un dominio.","steps":[{"title":"Inserisci g nella funzione f","tex":"f(g(x))=\\ln(2e^{-x})","text":"Poiché e^(−x) è sempre positivo, il logaritmo esiste per ogni x reale."},{"title":"Usa la proprietà del prodotto","tex":"\\ln(2e^{-x})=\\ln2+\\ln(e^{-x})=\\ln2-x","text":"L’esponenziale e il logaritmo si annullano."},{"title":"Inserisci f dentro g","tex":"g(f(x))=e^{-\\ln(2x)}","text":"Qui devi avere 2x>0, quindi x>0."},{"title":"Semplifica","tex":"e^{-\\ln(2x)}=\\frac1{e^{\\ln(2x)}}=\\frac1{2x}","text":"La formula è valida solo per x>0."}],"result":"(f\\circ g)(x)=\\ln2-x\\ (\\forall x\\in\\mathbb R),\\qquad(g\\circ f)(x)=\\frac1{2x}\\ (x>0)","note":"Le due composizioni hanno persino domini diversi."},{"reference":"Libro n. 427","title":"Trigonometria e radice","tex":"f(x)=\\sin(2x),\\qquad g(x)=\\sqrt{x}-1","intro":"La radice di una funzione richiede di controllare il segno del suo argomento.","steps":[{"title":"Calcola f∘g","tex":"f(g(x))=\\sin\\big(2(\\sqrt{x}-1)\\big)","text":"Sostituisci g(x) al posto della x nella funzione seno."},{"title":"Semplifica","tex":"f(g(x))=\\sin(2\\sqrt{x}-2),\\quad x\\ge0","text":"g(x) esiste solo per x≥0, mentre il seno accetta tutti i reali."},{"title":"Calcola g∘f","tex":"g(f(x))=\\sqrt{\\sin(2x)}-1","text":"Inserisci f(x) come argomento della radice."},{"title":"Trova il dominio di g∘f","tex":"\\sin(2x)\\ge0","text":"La composizione esiste esattamente quando il seno sotto radice non è negativo."}],"result":"(f\\circ g)(x)=\\sin(2\\sqrt{x}-2),\\quad (g\\circ f)(x)=\\sqrt{\\sin(2x)}-1","note":"Domini: f∘g richiede x≥0; g∘f richiede sin(2x)≥0."}],"book":[{"n":421,"tex":"f(x)=x+4,\\quad g(x)=x^2-x","result":"f\\circ g=x^2-x+4,\\quad g\\circ f=x^2+7x+12","reason":"Sostituisci l’espressione interna in ogni occorrenza della x esterna. Domini: R per entrambe."},{"n":422,"tex":"f(x)=3x,\\quad g(x)=\\ln x","result":"f\\circ g=3\\ln x,\\quad g\\circ f=\\ln(3x)","reason":"In entrambi i casi il dominio è x>0."},{"n":423,"tex":"f(x)=\\sqrt[3]{x},\\quad g(x)=8x^3-8","result":"f\\circ g=2\\sqrt[3]{x^3-1},\\quad g\\circ f=8x-8","reason":"La radice cubica è definita per ogni reale e si semplifica con il cubo. Domini: R."},{"n":424,"tex":"f(x)=\\frac1{4x^2},\\quad g(x)=4x^2","result":"f\\circ g=\\frac1{64x^4},\\quad g\\circ f=\\frac1{4x^4}","reason":"Tutte e due le composizioni richiedono x≠0, poiché compaiono denominatori con x."},{"n":425,"tex":"f(x)=2^x,\\quad g(x)=\\sqrt{x}-2","result":"f\\circ g=2^{\\sqrt{x}-2},\\quad g\\circ f=2^{x/2}-2","reason":"f∘g richiede x≥0; g∘f è definita per ogni reale perché 2^x è sempre positivo."},{"n":426,"tex":"f(x)=\\ln(2x),\\quad g(x)=e^{-x}","result":"f\\circ g=\\ln2-x,\\quad g\\circ f=\\frac1{2x}","reason":"Domini rispettivi: R e x>0. Usa ln(e^t)=t e l'esponenziale del logaritmo."},{"n":427,"tex":"f(x)=\\sin(2x),\\quad g(x)=\\sqrt{x}-1","result":"f\\circ g=\\sin(2\\sqrt{x}-2),\\quad g\\circ f=\\sqrt{\\sin(2x)}-1","reason":"Domini: x≥0 per f∘g; sin(2x)≥0 per g∘f."}],"quiz":[{"prompt":"Quanto vale f∘g?","tex":"f(x)=x+1,\\quad g(x)=2x","options":["2x+1","2x+2","x+3","2x^2"],"correct":0,"explain":"Devi calcolare f(g(x))=f(2x)=2x+1."},{"prompt":"Quanto vale g∘f?","tex":"f(x)=x+1,\\quad g(x)=2x","options":["2x+1","2x+2","x+2","(x+1)^2"],"correct":1,"explain":"Calcola g(f(x))=g(x+1)=2(x+1)."},{"prompt":"Qual è il dominio della composizione?","tex":"f(x)=\\sqrt{x},\\quad g(x)=x-4,\\quad f\\circ g","options":["x\\ge0","x>4","x\\ge4","x\\ne4"],"correct":2,"explain":"La composizione è √(x−4), quindi l’argomento della radice deve essere ≥0."},{"prompt":"Qual è il dominio della composizione?","tex":"f(x)=\\ln x,\\quad g(x)=x^2,\\quad f\\circ g","options":["x>0","x\\ne0","x\\ge0","\\mathbb{R}"],"correct":1,"explain":"ln(x²) richiede x²>0, cioè tutti i reali tranne zero."},{"prompt":"Quanto vale g∘f?","tex":"f(x)=x^2,\\quad g(x)=\\sqrt{x}","options":["x","x^2","|x|","\\sqrt{x}"],"correct":2,"explain":"g(f(x))=√(x²)=|x|, per tutti i reali."},{"prompt":"La composizione è commutativa?","tex":"f\\circ g\\stackrel{?}{=}g\\circ f","options":["\\text{sì, sempre}","\\text{solo se f e g sono lineari}","\\text{no, in generale}","\\text{solo con le radici}"],"correct":2,"explain":"L’ordine influisce sul risultato; confronta l’esercizio 421."}]}</script></body></html>
