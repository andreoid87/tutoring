<body><div id="app"><p>Caricamento del percorso…</p></div><script id="lesson-data" type="application/json">{"id":"segno","title":"Studio del segno","subtitle":"Capisci quando una funzione è positiva o negativa, trova gli zeri e le intersezioni con gli assi.","tone":"green","intro":"Studiare il segno significa individuare dove f(x)>0, f(x)\u003c0 e f(x)=0, rispettando sempre il dominio.","pitfall":"Un valore che annulla il denominatore NON è uno zero della funzione: è escluso dal dominio. Lo zero di una funzione deve essere un punto del dominio in cui f(x)=0.","map":[{"title":"1 · Dominio","text":"Escludi i valori impossibili."},{"title":"2 · Scomponi","text":"Trova gli zeri dei fattori."},{"title":"3 · Tabella","text":"Studia i segni sugli intervalli."},{"title":"4 · Combina","text":"Determina dove f è >0 e \u003c0."},{"title":"5 · Intersezioni","text":"Verifica gli assi x e y."}],"rules":[{"title":"Segno del prodotto","tex":"A(x)B(x)>0\\ \\Longleftrightarrow\\ \\text{stesso segno}","info":"Due fattori con lo stesso segno danno un prodotto positivo; con segno opposto, negativo."},{"title":"Segno della frazione","tex":"\\frac{A(x)}{B(x)}>0\\ \\Longleftrightarrow\\ A,B\\text{ concordi}","info":"Ricorda di escludere sempre i punti nei quali B(x) = 0."},{"title":"Zeri e asse x","tex":"f(x)=0\\quad\\Rightarrow\\quad(x,0)","info":"Per trovare l’intersezione con l’asse x risolvi f(x)=0, mantenendo soltanto le soluzioni nel dominio."},{"title":"Intersezione con l’asse y","tex":"x=0\\quad\\Rightarrow\\quad(0,f(0))","info":"Esiste solo se 0 fa parte del dominio. Se non è definita f(0), non c’è intersezione."},{"title":"Quadrato e radice","tex":"A(x)^2\\ge0,\\qquad \\sqrt{A(x)}\\ge0","info":"Una radice quadrata definita non è mai negativa. Un quadrato è positivo tranne dove il fattore vale zero."},{"title":"Attenzione agli estremi","tex":"f(x)>0\\ \\text{non include gli zeri}","info":"Quando chiedono dove f è positiva, gli zeri vanno indicati separatamente; i punti esclusi dal dominio non si includono mai."}],"guided":[{"title":"Segno di una frazione con due zeri","tex":"f(x)=\\frac{9-x^2}{5x}","intro":"Il numeratore cambia segno in −3 e 3; il denominatore si annulla in 0.","steps":[{"title":"Trova il dominio","tex":"D=\\mathbb{R}\\setminus\\{0\\}","text":"Il denominatore 5x non può essere zero."},{"title":"Scomponi il numeratore","tex":"9-x^2=(3-x)(3+x)","text":"Gli zeri sono −3 e +3."},{"title":"Ordina i punti critici","tex":"-3\\quad|\\quad0\\quad|\\quad3","text":"Dividono la retta in quattro intervalli."},{"title":"Prova il segno in ciascun intervallo","tex":"\\begin{array}{c|cccc}x&(-\\infty,-3)&(-3,0)&(0,3)&(3,+\\infty)\\\\\\hline f(x)&+&-&+&-\\end{array}","text":"Il numeratore è negativo fuori da [−3,3], positivo dentro; il denominatore ha il segno di x."}],"result":"f(x)>0\\Longleftrightarrow x\u003c-3\\ \\lor\\ 0\u003cx\u003c3","note":"Intersezioni con x: (−3,0) e (3,0). Nessuna con y: x=0 è escluso."},{"title":"Tre punti da mettere in ordine","tex":"f(x)=\\frac{1-x}{x^2-2x}","intro":"Osserva che gli zeri del numeratore e quelli del denominatore hanno ruoli diversi.","steps":[{"title":"Dominio","tex":"x^2-2x=x(x-2)\\ne0\\Rightarrow x\\ne0,2","text":"Escludi 0 e 2."},{"title":"Zero del numeratore","tex":"1-x=0\\Rightarrow x=1","text":"Il punto x=1 è ammesso e rappresenta uno zero della funzione."},{"title":"Punti critici e segni","tex":"\\begin{array}{c|cccc}x&(-\\infty,0)&(0,1)&(1,2)&(2,+\\infty)\\\\\\hline f(x)&+&-&+&-\\end{array}","text":"Metti i punti in ordine: 0, 1, 2."}],"result":"f(x)>0\\Longleftrightarrow x\u003c0\\ \\lor\\ 1\u003cx\u003c2","note":"L'unica intersezione con l'asse x è (1,0). Non c'è intersezione con l'asse y."},{"title":"Somma di due radici","tex":"f(x)=\\sqrt{1-x}+\\sqrt{x^2-4}","intro":"Le radici sono entrambe non negative: qui conviene iniziare dal dominio.","steps":[{"title":"Prima radice","tex":"1-x\\ge0\\Rightarrow x\\le1","text":"Il primo radicando deve essere non negativo."},{"title":"Seconda radice","tex":"x^2-4\\ge0\\Rightarrow x\\le-2\\ \\lor\\ x\\ge2","text":"La seconda radice esiste fuori dall'intervallo (−2,2)."},{"title":"Intersezione","tex":"D=(-\\infty,-2]","text":"Soltanto la parte x ≤ −2 soddisfa entrambe le condizioni."},{"title":"Segno della somma","tex":"\\sqrt{1-x}>0\\quad\\text{per ogni }x\\le-2","text":"La prima radice è sempre positiva nell'intero dominio; la seconda non è negativa."}],"result":"f(x)>0\\Longleftrightarrow x\\le-2","note":"La funzione non si annulla mai: nessuna intersezione con l’asse x o y."},{"title":"Un fattore quadrato al denominatore","tex":"f(x)=\\frac{x-5}{x^3-4x^2}","intro":"Il fattore x² non cambia segno ma può rendere la funzione indefinita.","steps":[{"title":"Scomponi","tex":"f(x)=\\frac{x-5}{x^2(x-4)}","text":"I valori x=0 e x=4 sono esclusi dal dominio."},{"title":"Studia il fattore quadrato","tex":"x^2>0\\quad\\text{per }x\\ne0","text":"Fuori dallo zero x² è sempre positivo, quindi non ribalta il segno."},{"title":"Studia il rapporto residuo","tex":"\\frac{x-5}{x-4}>0\\ \\Longleftrightarrow\\ x\u003c4\\ \\lor\\ x>5","text":"Numeratore e denominatore devono avere lo stesso segno."},{"title":"Ripristina l’esclusione","tex":"x\u003c4,\\ x\\ne0\\quad\\lor\\quad x>5","text":"Il punto x=0 resta escluso, anche se la semplificazione del segno non lo mostra."}],"result":"f(x)>0\\Longleftrightarrow (x\u003c4\\land x\\ne0)\\ \\lor\\ x>5","note":"Zero della funzione in x=5. I punti 0 e 4 non appartengono al dominio."}],"book":[{"tex":"x^2+x-12","result":"f(x)>0:\\ x\u003c-4\\ \\lor\\ x>3","reason":"(x+4)(x−3): positiva all’esterno delle radici. Zeri x=−4 e x=3; f(0)=−12."},{"tex":"x^3+x","result":"f(x)>0:\\ x>0","reason":"x(x²+1): il secondo fattore è sempre positivo. Zero e intersezione con entrambi gli assi in (0,0)."},{"tex":"\\frac{9-x^2}{5x}","result":"f(x)>0:\\ x\u003c-3\\ \\lor\\ 0\u003cx\u003c3","reason":"Denominatore diverso da zero. Zeri x=±3; x=0 non appartiene al dominio."},{"tex":"\\frac{1-x}{x^2-2x}","result":"f(x)>0:\\ x\u003c0\\ \\lor\\ 1\u003cx\u003c2","reason":"Esclusi x=0 e x=2. Lo zero x=1 è l’intersezione con l’asse x."},{"tex":"\\frac{x-12}{x+6}","result":"f(x)>0:\\ x\u003c-6\\ \\lor\\ x>12","reason":"La frazione è positiva con numeratore e denominatore concordi. Zero x=12; f(0)=−2."},{"tex":"\\frac{x^2+1}{\\sqrt{4x-12}}","result":"f(x)>0:\\ x>3","reason":"Il denominatore richiede x>3 e il numeratore è sempre positivo. Nessuno zero."},{"tex":"\\frac{-6x}{x^2-16}","result":"f(x)>0:\\ x\u003c-4\\ \\lor\\ 0\u003cx\u003c4","reason":"Esclusi x=−4 e x=4. Zero x=0, che è anche intersezione con l’asse y."},{"tex":"\\sqrt{1-x}+\\sqrt{x^2-4}","result":"f(x)>0:\\ x\\le-2","reason":"Dominio x≤−2, nel quale la prima radice è strettamente positiva. Nessuno zero."},{"tex":"\\frac{x-3}{x(6-x)^2}","result":"f(x)>0:\\ x\u003c0\\ \\lor\\ (x>3,\\ x\\ne6)","reason":"Esclusi x=0 e x=6. Il quadrato del denominatore è positivo dove definito. Zero x=3."},{"tex":"\\frac{x-5}{x^3-4x^2}","result":"f(x)>0:\\ (x\u003c4,\\ x\\ne0)\\ \\lor\\ x>5","reason":"x² è positivo dove definito; x=0 e x=4 esclusi. Zero x=5."}],"quiz":[{"prompt":"Dove è positivo il prodotto?","tex":"f(x)=(x-2)(x+1)","options":["-1\u003cx\u003c2","x\u003c-1\\ \\lor\\ x>2","x>-1","x\u003c2"],"correct":1,"explain":"Con due fattori lineari e coefficiente principale positivo, il prodotto è >0 fuori dagli zeri −1 e 2."},{"prompt":"Dove è strettamente positiva la frazione?","tex":"f(x)=\\frac{x}{x-3}","options":["x\\le0\\ \\lor\\ x>3","0\u003cx\u003c3","x\u003c0\\ \\lor\\ x>3","x\\ne3"],"correct":2,"explain":"I due fattori hanno lo stesso segno per x\u003c0 oppure x>3. In x=0 la funzione vale zero."},{"prompt":"Dove è positiva la radice?","tex":"f(x)=\\sqrt{x-1}","options":["x\\ge1","x>1","x\u003c1","x\\ne1"],"correct":1,"explain":"La radice esiste per x≥1 ma è strettamente >0 solo per x>1."},{"prompt":"Qual è l’intersezione con l’asse x?","tex":"f(x)=\\frac{x-3}{x-1}","options":["(1,0)","(0,-3)","(3,0)","(0,3)"],"correct":2,"explain":"Una frazione è zero quando il numeratore vale zero e il denominatore no: x=3."},{"prompt":"Quando è positiva?","tex":"f(x)=-(x-3)^2","options":["x>3","x\u003c3","\\forall x\\in\\mathbb R","\\text{mai}"],"correct":3,"explain":"Il quadrato non è negativo: con il meno davanti la funzione è sempre ≤0."},{"prompt":"Quando è positiva la frazione?","tex":"f(x)=\\frac{x^2+1}{x-4}","options":["x\u003c4","x>4","x\\ne4","x=4"],"correct":1,"explain":"Il numeratore è sempre positivo; conta soltanto il segno del denominatore."}]}</script></body></html>
